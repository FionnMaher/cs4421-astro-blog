name: Deploy to ECS

on:
  push:
    branches: [main]  # change to your branch name

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: eu-west-1

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag, and push image to ECR
        run: |
          docker build --platform linux/amd64 -t my-astro-app .
          docker tag my-astro-app:latest 456774513196.dkr.ecr.eu-west-1.amazonaws.com/my-astro-app:v1.0.0ç
          docker push 456774513196.dkr.ecr.eu-west-1.amazonaws.com/my-astro-app:v1.0.0

      - name: Force new ECS deployment
        run: |
          aws ecs update-service \
            --cluster default \
            --service my-astro-app-71aa \
            --force-new-deployment \
            --region eu-west-1
